name: CI

# The pull request gate. It runs on every pull request and on every push to
# main, and branch protection on main requires this `ci` check, so a red run
# blocks the merge and a green one is the signal the reviewer reads.
#
# Merging ships nothing. A release is a bare version tag pushed by the
# maintainer (see release.yml where present); this workflow never tags,
# never publishes and never writes to the repository.
#
# Every action is pinned to a commit SHA (suite policy).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exactly what the lockfile says
        run: npm ci

      - name: Gate (typecheck, build, lint, tests)
        run: npm run gate
